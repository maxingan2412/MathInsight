[project]
name = "mathinsight"
version = "0.1.0"
description = "数鉴（MathInsight）：高中数学智能学情分析与个性化辅导系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC BY-NC-ND 4.0" }
authors = [{ name = "Xingan Ma" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
import = ["beautifulsoup4>=4.12"]
dev = ["pytest>=7"]

[project.scripts]
mathinsight = "mathinsight.cli:main"

[tool.setuptools]
packages = ["mathinsight"]
